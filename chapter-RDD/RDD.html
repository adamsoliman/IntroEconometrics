## Course Transition: ***Research Methods***

* We cover two causal evaluation methods commonly used in economics:

  - ***regression discontinuity designs (RDD)***
  - ***differences-in-differences (DiD)***

* A third workhorse, ***instrumental variables (IV)***, is not covered in this course.

* All of these methods are used to identify __causal relationships__ between treatments and outcomes when treatment is *not* randomly assigned.

---

# Today: **Regression Discontinuity Design (RDD)**

* **Starting point**: subjects are ***not*** randomly allocated to treatment ⚠️

* **Idea**: life is full of arbitrary rules that assign some to treatment and others to control. If we know the assignment rule, we can exploit it.

* **Key assumption**: the variable that assigns treatment cannot be manipulated by individuals

* **Empirical application:** effect of the legal drinking age on mortality

---

# Discontinuities are Everywhere

There are many arbitrary rules in life that determine assignment to some treatment:

* In North Carolina, you used to have to have reached the age of five by October 16 in the relevant year to be eligible to enter kindergarten [(Cook and Kang, 2016)](https://pubs.aeaweb.org/doi/pdfplus/10.1257/app.20140323);

* In the US, a new born baby weighing less than 1,500 grams is considered to be of "very low birth weight" and receives additional treatment [(Almond et al., 2010)](https://academic.oup.com/qje/article/125/2/591/1882183);

* Flagship state universities use a certain SAT cutoff level to select their students [(Hoekstra, 2009)](https://cdn.theatlantic.com/static/mt/assets/business/Hoekstra_Flagship.pdf);

* In Italy, there are quotas of residence permits for illegal immigrants that are allocated on a first-come first-served basis until quota is exhausted [(Pinotti, 2017)](https://pubs.aeaweb.org/doi/pdfplus/10.1257/aer.20150355);

We will focus our analysis on the following discontinuity:

* In the US, the legal drinking age is 21 years old [(Carpenter and Dobkin, 2009)](http://masteringmetrics.com/wp-content/uploads/2015/01/Carpenter-and-Dobkin-2009.pdf).

---

# An Example: Alcohol Consumption and Mortality

* Imagine you are interested in assessing the __causal__ impact of alcohol consumption by young adults on mortality.

* Why is this not that straightforward? Why can't you just compare the mortality of heavy and light drinkers?

--

  * Because there may be unobserved selection into drinking that is also a determinant of mortality (e.g., risk-taking).

* The minimum legal drinking age (MLDA) offers a way out, and it is policy relevant: there is an ongoing debate on whether the MLDA should be lowered to 18, as it was in the Vietnam era.

---

# Key Terms and Intuition

&gt; ***Running variable:*** variable that determines assignment to treatment.

`\(\rightarrow\)` `\(a\)` = age

&gt; ***Cutoff level:*** level of the ***running variable*** above (or below) which individuals are treated (or not).

`\(\rightarrow\)` `\(c = 21\)` year old birthday

--

Causal intuition:

* How different are individuals *just before* and *just after* their 21st birthday, other than legal access to alcohol?

* Around the threshold, allocation to treatment is ***as good as random***.

* 👉 ***Regression discontinuity design*** exploits this allocation to treatment!

# RDD Framework

* ***Treatment variable***: `\(D_a\)`

  - `\(D_a\)` = 1 if individual is over 21 years old, `\(D_a\)` = 0 if not.

  - `\(D_a\)` is a function of the individual's age, `\(a\)`, which is the ***running variable***.

* The ***cutoff*** age, 21, separates those who can drink legally and those who can't:
  $$
  D_a = \begin{cases}\begin{array}{lcl}
  1 \quad \text{if } a \geq 21 \\\
  0 \quad \text{if } a &lt; 21
  \end{array}\end{cases}
  $$

## Key features of RD designs

1. Treatment status is a __deterministic__ function of `\(a\)` `\(\rightarrow\)` we know the assignment rule

1. Treatment status is a __discontinuous__ function of `\(a\)` `\(\rightarrow\)` there is some cutoff level

# RDD as Local Average Treatment Effect (LATE)

* The RD estimator is a __local average treatment effect (LATE)__.

* It only tells you the impact of treatment `\(D\)` on outcome `\(Y\)` ***around*** the cutoff value of the running variable.

* Limited ***external validity*** `\(\rightarrow\)` you cannot extrapolate to the entire population.

* Using the 21 year old alcohol restriction age in the RD context will only tell you the effect of this restriction on death rates around age 21, not the general effect of alcohol consumption.

---

# Estimation

---

# Estimation

* *Objective:* measure the ***gap*** between the two lines at the cutoff.

* In its simplest form, we can write the following regression model:
    `$$DEATHRATE_a = \alpha + \delta D_a + \beta a + \varepsilon_a,$$`
  where `\(DEATHRATE_a\)` is the death rate at age `\(a\)`, `\(D_a\)` is the treatment dummy, and `\(a\)` is age (in years, centered at the 21st birthday so that `\(a = 0\)` at the cutoff).

  `\(\rightarrow\)` `\(\delta\)` captures the **jump in death rate** between individuals above and below 21 years old.

* Formally, the RDD estimator exploits a discontinuity at the cutoff in the conditional expectation function:
`$$\underbrace{\lim_{c \to 0^+} \mathbb{E}[DEATHRATE_a|a = c]}_{\alpha + \delta} - \underbrace{\lim_{c \to 0^-} \mathbb{E}[DEATHRATE_a|a = c]}_{\alpha} = \delta$$`

---

# Simple Linear Model Estimation: all cause mortality

.pull-left[

``` r
mlda &lt;- mlda %&gt;%
  mutate(over21 = (agecell &gt;= 21),
         agecell_21 = agecell - 21)
rdd &lt;- lm(all ~ agecell_21 + over21, mlda)


tidy(rdd)
```
]

.pull-right[

```
## # A tibble: 3 × 5
##   term        estimate std.error statistic  p.value
##   &lt;chr&gt;          &lt;dbl&gt;     &lt;dbl&gt;     &lt;dbl&gt;    &lt;dbl&gt;
## 1 (Intercept)   91.8       0.805    114.   4.59e-57
## 2 agecell_21    -0.975     0.632     -1.54 1.30e- 1
## 3 over21TRUE     7.66      1.44       5.32 3.15e- 6
```
]

--

&lt;br&gt;

***Interpretation:***

At the age-21 cutoff, gaining legal access to alcohol increases the mortality rate by an estimated 7.66 deaths per 100,000. Relative to the predicted mortality rate immediately below age 21 (91.8 deaths per 100,000), this represents an 8.3% increase. The intercept represents predicted mortality just below the cutoff because we centered age at 21. The negative age coefficient indicates a slight downward trend in mortality with age, although it is not statistically significant.

---

# Simple Linear Model Estimation: all cause mortality (continued)


$$
Y_i=\beta_0+\beta_1(\text{Age}_i-21)+\beta_2\text{Over21}_i+\varepsilon_i
$$

$$
\widehat{\text{Mortality}}_i=91.8-0.975(\text{Age}_i-21)+7.66\text{Over21}_i
$$



Table: Predicted mortality from the common-slope RD model

|Age                        |Predicted mortality (per 100,000) |
|:--------------------------|:---------------------------------|
|20.9                       |91.8 - 0.975(-0.1) = 91.90        |
|Approaching 21 from below  |91.8                              |
|At 21 (legal drinking age) |91.8 + 7.66 = 99.46               |
|21.1                       |91.8 - 0.975(0.1) + 7.66 = 99.36  |

*Note:* The prediction just below age 21 is the left-hand limit; at age 21, `over21 = TRUE`.

Same model, different outcome (`mva`):


``` r
mlda_alt &lt;- mlda %&gt;% mutate(over21_bin = ifelse(agecell &gt;= 21, 1, 0),
                            agecell_21 = agecell - 21)
tidy(lm(mva ~ agecell_21 + over21_bin, mlda_alt))

***Interpretation:***

On average, the MLDA increases motor vehicle deaths by 4.53 per 100,000 relative to those just under the age of 21. As a share: 4.53/29.4*100 = 15.4%. A large part of the increase in all cause mortality (4.53 of 7.66) comes from motor vehicle accidents, consistent with an increase in drunk driving.

# Estimation Issues

* The ***functional form*** used to approximate the lines really matters!

   `\(\rightarrow\)` an insufficiently flexible specification runs the risk of mistaking nonlinearity for treatment effect;

   `\(\rightarrow\)` an overly flexible specification reduces precision and runs the risk of overfitting.

Let's see this with some simulated data.

---

# Simulations - Linear Relationship and Clear Discontinuity

&lt;img src="RDD_files/figure-html/unnamed-chunk-11-1.svg" alt="" style="display: block; margin: auto;" /&gt;

`$$outcome_i = \alpha + \color{#d90502}\delta treatment_i + \beta running_i + e_i,$$`

---

# Simulations - Quadratic Relationship and Clear Discontinuity

&lt;img src="RDD_files/figure-html/unnamed-chunk-12-1.svg" alt="" style="display: block; margin: auto;" /&gt;

`$$outcome_i = \alpha + \color{#d90502}\delta treatment_i + \beta_1 running_i + \color{#d90502}{\beta_2 running_i^2} + e_i,$$`

---

# Simulations - Nonlinear Relationship and NO Discontinuity

&lt;img src="RDD_files/figure-html/unnamed-chunk-13-1.svg" alt="" style="display: block; margin: auto;" /&gt;

The true relationship (dotted) is smooth through the cutoff, but the linear fits on each side show a jump: a ***spurious*** treatment effect.

---

# How to Choose Appropriate Functional Form?

* Essential to __visualise__ the data!

* Coefficients across models shouldn't vary too much.

* Should we expect the relationship between the outcome variable and the running variable to be nonlinear? Should we expect it to differ around the cutoff?

* [Gelman and Imbens (2019)](https://www.tandfonline.com/doi/abs/10.1080/07350015.2017.1366909), "Why High-Order Polynomials Should Not Be Used in Regression Discontinuity Designs":
  *"We recommend researchers [...] use estimators based on local linear or quadratic polynomials or other smooth functions."*

---

# Going Back to our Example: Nonlinearities / `\(\neq\)` Slopes?

&lt;img src="RDD_files/figure-html/unnamed-chunk-14-1.svg" alt="" style="display: block; margin: auto;" /&gt;

Solid: linear fit. Dashed: quadratic fit, allowed to differ on each side of the cutoff. The gap is similar for both specifications (about 7.7 vs. 9.5 per 100,000).

---

# Jumps at 21 Across Causes of Death

&lt;img src="RDD_files/figure-html/unnamed-chunk-15-1.svg" alt="" style="display: block; margin: auto;" /&gt;

`mva`: motor vehicle accidents. `internal`: deaths from internal causes (e.g., disease). The jump shows up for `all` and `mva`, but not for `internal`.

# Nonparametric Estimation

* Give more weight to observations close to the cutoff level

2 settings:

  * How much more weight?

  `\(\rightarrow\)` depends on the chosen ***kernel***.

  * How far away from the cutoff do observations need to be to be discarded?

  `\(\rightarrow\)` depends on the chosen ***bandwidth***.

Luckily there's an `R` package that chooses these settings in a data-driven way: `rdrobust`.

---

# Nonparametric Estimation: A Narrow Bandwidth

&lt;img src="RDD_files/figure-html/unnamed-chunk-16-1.svg" alt="" style="display: block; margin: auto;" /&gt;

Using only age cells within about 7 months of the cutoff (bandwidth), the estimated jump is 9.0 per 100,000, similar to the full-sample estimates.

# Identifying Assumptions

---

# RDD Assumptions

&gt; *Key assumption*: ***Potential outcomes are smooth at the threshold.***

`\(\rightarrow\)` assignment variable cannot be manipulated!

Formally:

`$$\lim_{r \to c^+} E[Y_i^d|R_i = r] = \lim_{r \to c^-} E[Y_i^d|R_i = r], \quad d \in \{0,1\}$$`

* The population just below must not be discretely different from the population just above the cutoff.

* Assumption is violated if people can manipulate the running variable because they know the cutoff value.

* Knowing the cutoff value in itself does not violate the assumption, only ability to manipulate running variable does.

* In our example: nobody can choose their date of birth, so nobody can sort around the 21st birthday.

---

# Why Smoothness Identifies the Treatment Effect

If the assumption holds, we have:

$$
`\begin{align}
&amp;\lim_{r \to c^+} \mathbb{E}[Y_i | R_i = r] - \lim_{r \to c^-} \mathbb{E}[Y_i | R_i = r] \\
= &amp;\lim_{r \to c^+} \mathbb{E}[Y_i^1 | R_i = r] - \lim_{r \to c^-} \mathbb{E}[Y_i^0 | R_i = r] \\
= &amp;\mathbb{E}[Y_i^1 | R_i = c] - \mathbb{E}[Y_i^0 | R_i = c] \\
= &amp;\underbrace{\mathbb{E}[Y_i^1 - Y_i^0 | R_i = c]}_\text{average treatment effect at the cutoff} \\
\end{align}`
$$

* 1st to 2nd line: above the cutoff everyone is treated, below no one is (the assignment rule).

* 2nd to 3rd line: smoothness of potential outcomes. In our example, `\(R_i = a_i\)` and `\(c = 21\)`.

---

# Noncompliance

What if the running variable does not *fully* determine assignment to treatment?

`\(\rightarrow\)` ***Fuzzy RDD***

* Even if not everyone who satisfies the treatment condition is treated, there is still a jump in the probability of being treated.

* For you, just know that the problem of imperfect determination of allocation to treatment can still be solved
