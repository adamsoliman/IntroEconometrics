# ── Chapter: Simple Linear Regression ──
## Reviewing: Intro to R &amp; Course Concepts

---

# Warm-Up Questions

**Q1.** Which of the following is a causal question?

a) What is the average income of Clemson graduates?

b) What will the unemployment rate be next quarter?

c) Does attending a smaller class cause higher test scores?

d) How many students are enrolled in ECON 4050 this semester?

**Q2.** Selection bias in a survey occurs when:

a) The sample is very large

b) The survey asks too many questions

c) The sample is not representative of the population we care about

d) The researcher uses the wrong statistical software

---

class: center, middle, inverse

# ── Chapter: Introduction to Causality ──
## Reviewing: Simple Linear Regression

---

# Warm-Up Questions

**Q1.** The OLS estimator chooses the regression line by minimizing:

a) The sum of residuals

b) The correlation between X and Y

c) The sum of squared residuals

d) The R²

**Q2.** In `\(Y_i = \beta_0 + \beta_1 X_i + \varepsilon_i\)`, how is `\(\hat{\beta}_1\)` interpreted?

a) The value of Y when X equals zero

b) The correlation between X and Y

c) The fraction of variance in Y explained by X

d) The average change in Y associated with a one-unit increase in X

---

class: center, middle, inverse

# ── Chapter: Multiple Linear Regression ──
## Reviewing: Introduction to Causality

---

# Warm-Up Questions

**Q1.** The fundamental problem of causal inference is that:

a) Experiments are always too expensive to run

b) OLS is biased in small samples

c) We can never observe both potential outcomes for the same person at the same time

d) Correlation always implies causation

**Q2.** Why does random assignment of treatment eliminate selection bias?

a) It increases the sample size

b) It makes R² equal to 1

c) Treatment becomes independent of potential outcomes, so groups are comparable on average

d) It guarantees equal group sizes

---

class: center, middle, inverse

# ── Chapter: Linear Regression Extensions ──
## Reviewing: Multiple Linear Regression

---

# Warm-Up Questions

**Q1.** In `\(Y = \beta_0 + \beta_1 X_1 + \beta_2 X_2 + \varepsilon\)`, how is `\(\hat\beta_1\)` interpreted?

a) The total effect of `\(X_1\)` on `\(Y\)` regardless of `\(X_2\)`

b) The correlation between `\(X_1\)` and `\(Y\)`

c) The average change in Y for a one-unit increase in `\(X_1\)`, holding `\(X_2\)` constant

d) The predicted value of Y when `\(X_1 = 1\)`

**Q2.** Omitted Variable Bias (OVB) arises when an omitted variable is:

a) Correlated only with the dependent variable Y

b) Correlated only with the included regressor

c) Uncorrelated with everything in the model

d) Correlated with both the included regressor and the outcome Y

---

class: center, middle, inverse

# ── Chapter: Sampling ──
## Reviewing: Linear Regression Extensions

---

# Warm-Up Questions

**Q1.** In a **log-linear** model `\(\ln(Y) = \beta_0 + \beta_1 X + \varepsilon\)`, how is `\(\hat\beta_1\)` interpreted?

a) A 1-unit increase in X leads to a `\(\hat\beta_1\)`-unit increase in Y

b) A 1% increase in X leads to a `\(\hat\beta_1\)`% increase in Y

c) A 1-unit increase in X leads to approximately a `\(100 \cdot \hat\beta_1\)`% increase in Y

d) A 1-unit increase in X leads to a `\(\hat\beta_1\)`% decrease in Y

**Q2.** In a **log-log** model `\(\ln(Y) = \beta_0 + \beta_1 \ln(X) + \varepsilon\)`, `\(\hat\beta_1\)` represents:

a) The level change in Y for a 1-unit change in X

b) The percentage change in X for a 1% change in Y

c) The sample correlation between `\(\ln(Y)\)` and `\(\ln(X)\)`

d) The elasticity of Y w.r.t. X: a 1% increase in X gives a `\(\hat\beta_1\)`% change in Y

---

# ── Chapter: Confidence Intervals &amp; Hypothesis Testing ──
## Reviewing: Sampling

---

# Warm-Up Questions

**Q1.** The standard error of a sample statistic measures:

a) The bias of the estimator

b) The average prediction error for individual observations

c) The distance between the sample mean and the true population mean

d) The variability of the sample statistic across repeated samples

**Q2.** According to the Central Limit Theorem, as sample size increases:

a) The population distribution becomes approximately normal

b) The standard error grows larger

c) Individual observations become less variable

d) The sampling distribution of the sample mean approaches a normal distribution

---

class: center, middle, inverse

# ── Chapter: Regression Inference ──
## Reviewing: Confidence Intervals &amp; Hypothesis Testing

---

# Warm-Up Questions

**Q1.** A correct interpretation of a **95% confidence interval** is:

a) There is a 95% probability the true parameter lies in this specific interval

b) 95% of the data fall within the interval

c) The estimator is correct 95% of the time

d) If we repeated sampling many times, 95% of such intervals would contain the true parameter

**Q2.** You get a p-value of **0.02** with significance level `\(\alpha = 0.05\)`. You should:

a) Fail to reject the null hypothesis

b) Accept the null hypothesis

c) Collect more data before deciding

d) Reject the null hypothesis

---

class: center, middle, inverse

# ── Chapter: Regression Discontinuity ──
## Reviewing: Regression Inference

---

# Warm-Up Questions

**Q1.** The t-statistic for a regression coefficient `\(\hat\beta_k\)` is:

a) `\(\hat\beta_k \times SE(\hat\beta_k)\)`

b) `\(SE(\hat\beta_k) \div \hat\beta_k\)`

c) p-value `\(\div \hat\beta_k\)`

d) `\(\hat\beta_k \div SE(\hat\beta_k)\)`

**Q2.** A coefficient being "statistically significant at the 5% level" means:

a) The effect is economically important

b) The coefficient explains 5% of the variation in Y

c) There is a 5% chance the coefficient equals zero

d) We would observe a t-statistic this large less than 5% of the time if the true coefficient were zero

---

class: center, middle, inverse

# ── Chapter: Difference-in-Differences ──
## Reviewing: Regression Discontinuity

---

# Warm-Up Questions

**Q1.** The key feature that makes RDD valid is:

a) Treatment is randomly assigned across all units

b) We have a very large sample

c) Units just above and below the cutoff are as-good-as randomly assigned to treatment

d) The running variable is measured without error

**Q2.** A key assumption required for RDD is:

a) Parallel trends in pre-treatment outcomes

b) The instrument is uncorrelated with the outcome

c) Treatment and control groups are the same size

d) Units cannot precisely manipulate which side of the cutoff they fall on

---

class: center, middle, inverse

# ── Chapter: Panel Data ──
## Reviewing: Difference-in-Differences

---

# Warm-Up Questions

**Q1.** The Difference-in-Differences estimator is:

a) The difference in outcomes between treated and control after treatment

b) The change over time for the treated group only

c) The difference in outcomes between treated and control before treatment

d) [After − Before] for the treated group minus [After − Before] for the control group

**Q2.** The parallel trends assumption states that:

a) Treatment and control groups must be identical before treatment

b) Treatment must be randomly assigned

c) There are no time-varying confounders anywhere

d) In the absence of treatment, both groups would have followed the same time trend

---
